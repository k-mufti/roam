[project]
name = "trip-package-backend"
version = "0.1.0"
description = "Multi-source place aggregation, credibility-weighted scoring, and itinerary optimization."
requires-python = ">=3.11,<3.14"

dependencies = [
  # API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",

  # Persistence. psycopg 3 binary wheels avoid needing libpq headers locally.
  "SQLAlchemy>=2.0.36",
  "GeoAlchemy2>=0.15",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",

  # HTTP + scraping
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",

  # Entity resolution. rapidfuzz is C++-backed, pure-wheel, and much faster
  # than python-Levenshtein for the token-set ratios we need.
  "rapidfuzz>=3.10",

  # NLP. VADER is a rule/lexicon sentiment model: no training, no model
  # download, ~1ms per doc. Deliberately chosen over spaCy/transformers, which
  # would add 500MB+ for marginal gain on short review text.
  "vaderSentiment>=3.3.2",
  # scikit-learn pulls its weight twice: KMeans for geographic day-clustering
  # and TfidfVectorizer for keyword extraction in the tagging pipeline.
  "scikit-learn>=1.5",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[project.scripts]
trip = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ingestion/fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. `Depends(...)` in a default is
# FastAPI's documented dependency-injection syntax, not a mistake.
"app/api/routes/*.py" = ["B008"]
